organization:
  name: <organization-name>
  url: <organization-url>
  project:
    name: <project-name>
    url: <project-url>
  board:
    area: <board-area>
    assigned_to: <assigned-to>

repos:
  <repo-name>:
    path: repos/<repo-name>
    git: <repo-git-url>
    ado_repo: <ado-repo-name>
    desc: <repo-description>
    lang: <repo-language>
    status: active
    target_branch: <target-branch>

infrastructure:
  databases: none
  cache: none
  deploy:
    method: dotnet package
    trigger: release
    provider: manual